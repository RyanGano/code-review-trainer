name: Frontend - Build and Deploy code-review-trainer-app

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# Serialise runs per ref. cancel-in-progress is deliberately false: this
# workflow deploys to Azure Static Web Apps (and closes preview environments),
# and cancelling mid-deploy can leave an environment stranded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      # Static Web Apps uses repo_token to post the preview-environment comment
      # on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "code-review-trainer-app/.nvmrc"
          cache: "npm"
          cache-dependency-path: "code-review-trainer-app/package-lock.json"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_OCEAN_029A8DF1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/code-review-trainer-app"
          api_location: ""
          output_location: "dist"
          skip_app_build: false
        env:
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_OCEAN_029A8DF1E }}
          action: "close"
