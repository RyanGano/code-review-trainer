name: Frontend - Build and Deploy code-review-trainer-app

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# Serialise runs per ref. cancel-in-progress is deliberately false: this
# workflow deploys to Azure Static Web Apps (and closes preview environments),
# and cancelling mid-deploy can leave an environment stranded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      # Static Web Apps uses repo_token to post the preview-environment comment
      # on pull requests.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "code-review-trainer-app/.nvmrc"
          cache: "npm"
          cache-dependency-path: "code-review-trainer-app/package-lock.json"
      # Dependabot-triggered runs get no repository secrets, so the deploy action cannot run
      # for them. Build on the runner instead, so a dependency update still proves the build.
      - name: Build (Dependabot)
        if: github.actor == 'dependabot[bot]'
        working-directory: code-review-trainer-app
        run: |
          npm ci
          npm run build
      - name: Build And Deploy
        id: builddeploy
        if: github.actor != 'dependabot[bot]'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_OCEAN_029A8DF1E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/code-review-trainer-app"
          api_location: ""
          output_location: "dist"
          skip_app_build: false
        env:
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  close_pull_request_job:
    # Dependabot PRs never create a preview environment (see above), so there is nothing to close.
    # Keyed on the PR author, since whoever merges or closes it is the actor here.
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_OCEAN_029A8DF1E }}
          action: "close"
