# Dependency updates. Each ecosystem gets one grouped PR for minor and patch updates and a
# separate grouped PR for major updates, so routine bumps stay small and breaking ones are
# reviewed on their own.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/code-review-trainer-app"
    ignore:
      # TypeScript 7 runs beside TypeScript 6 through the npm aliases in package.json
      # until typescript-eslint supports TS 7.1; then drop the aliases and this rule.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"

  - package-ecosystem: "nuget"
    directory: "/code-review-trainer-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      nuget-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
