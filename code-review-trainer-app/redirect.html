<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Signing in - Code Review Trainer</title>
  </head>
  <body>
    <p>Processing authentication...</p>
    <!-- MSAL 5 redirect bridge: hands the auth response back to the main window.
         Keep this page free of any other script, routing or MsalProvider. -->
    <script type="module">
      import { broadcastResponseToMainFrame } from "@azure/msal-browser/redirect-bridge";

      broadcastResponseToMainFrame().catch((error) => {
        console.error("Error broadcasting response:", error);
      });
    </script>
  </body>
</html>
